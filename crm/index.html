<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f8f4ed">
    <title>Legohus CRM</title>
    <link rel="icon" href="../images/legohus.svg" type="image/svg+xml">
    <!-- Ej inloggad: till inloggningen, med adressen man ville till. -->
    <script>try{if(!localStorage.getItem('ih-crm-inloggad'))location.replace('logga-in.html'+(location.hash.indexOf('#/')===0?'?nasta='+encodeURIComponent(location.hash):''))}catch(e){}</script>
    <!-- Omladdning börjar alltid högst upp – annars återställer webbläsaren
         rullningen innan vyn hunnit ritas och sidan hamnar en bit ned. -->
    <script>try{if('scrollRestoration' in history)history.scrollRestoration='manual'}catch(e){}</script>
    <!-- Infälld sidomeny (dator) sätts före första målningen så att den inte blinkar till. -->
    <script>try{if(localStorage.getItem('ih-crm-sido-dold')==='1')document.documentElement.setAttribute('data-sido-dold','')}catch(e){}</script>
    <link rel="preload" href="../fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/poppins-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="crm.css?v=20261028a">
    <link rel="stylesheet" href="vyer.css?v=20261028a">
    <link rel="stylesheet" href="mote.css?v=20261028a">
    <link rel="stylesheet" href="ljus.css?v=20261028a">
  </head>
  <body>
    <div class="app" id="app"></div>
    <script src="data.js?v=20261028a"></script>
    <script src="app.js?v=20261028a"></script>
    <script src="mote.js?v=20261028a"></script>
    <script src="vyer.js?v=20261028a"></script>
    <script>
      (function () {
        var klar = false;
        var go = function () { if (!klar) { klar = true; if (performance.mark) performance.mark('ih-start'); IH.starta(); if (performance.mark) performance.mark('ih-ritad'); } };
        if (document.fonts && document.fonts.load) {
          Promise.race([
            Promise.all(['500 1em Poppins', '600 1em Poppins', '700 1em Poppins', '400 1em Manrope'].map(function (f) { return document.fonts.load(f); })),
            new Promise(function (r) { setTimeout(r, 350); })
          ]).then(go, go);
        } else go();
      })();
    </script>
  </body>
</html>
