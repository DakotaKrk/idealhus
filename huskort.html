<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Våra husmodeller | Idealhus</title>
    <script>
      // Huskortet är uppdelat i en sida per hus. Gamla länkar
      // huskort.html?typ=...&modell=... skickas vidare, och #i-3d och
      // övriga parametrar (t.ex. ?tema=mork) följer med. Utan giltiga
      // parametrar blir det Sadel 30, som förut.
      (function () {
        var sidor = { attefallshus: ['sadel-30', 'sadel-30-bred', 'pulpet-30'], fritidshus: ['kupa-40', 'kupa-50'] };
        try {
          var p = new URLSearchParams(location.search);
          var lista = sidor[p.get('typ')];
          var nr = parseInt(p.get('modell'), 10);
          var mal = (Array.isArray(lista) && nr >= 1 && nr <= lista.length) ? lista[nr - 1] : 'sadel-30';
          p.delete('typ');
          p.delete('modell');
          var q = p.toString();
          location.replace(mal + '.html' + (q ? '?' + q : '') + location.hash);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="images/idealhus.svg?v=2" type="image/svg+xml">
    <link rel="icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48">
    <link rel="stylesheet" href="styles.css?v=20261010l">
    <link rel="stylesheet" href="design.css?v=20261010l">
  </head>
  <body>
    <main id="innehall" class="ih-sektion">
      <div class="ih-inre">
        <h1>Våra husmodeller</h1>
        <ul>
          <li><a href="sadel-30.html">Sadel 30 – attefallshus, 30 m², 1 rum</a></li>
          <li><a href="sadel-30-bred.html">Sadel 30 Bred – attefallshus, 30 m², 2 rum</a></li>
          <li><a href="pulpet-30.html">Pulpet 30 – attefallshus, 30 m², 2 rum</a></li>
          <li><a href="kupa-40.html">Kupa 40 – fritidshus, 40 m², 2 rum</a></li>
          <li><a href="kupa-50.html">Kupa 50 – fritidshus, 50 m², 2 rum</a></li>
        </ul>
        <p><a href="./">Till startsidan</a></p>
      </div>
    </main>
  </body>
</html>
