    <link rel="canonical" href="https://legohusstockholm.se/kupa-30.html">
    <meta http-equiv="refresh" content="0; url=kupa-30.html">
    <script>
      // Gamla länkar huskort.html?typ=...&modell=... skickas till närmaste
      // nya hus (2026-11-13). #i-3d och övriga parametrar följer med.
      (function () {
        var sidor = { attefallshus: ['kupa-30', 'kupa-30', 'kupa-30'], fritidshus: ['kupa-40', 'sadel-50'] };
        try {
          var p = new URLSearchParams(location.search);
          var lista = sidor[p.get('typ')];
          var nr = parseInt(p.get('modell'), 10);
          var mal = (Array.isArray(lista) && nr >= 1 && nr <= lista.length) ? lista[nr - 1] : 'kupa-30';
          p.delete('typ');
          p.delete('modell');
          var q = p.toString();
          location.replace(mal + '.html' + (q ? '?' + q : '') + location.hash);
        } catch (e) {}
      })();
    </script>
